<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NU7.1 miner poll ballot</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  fieldset { border: 1px solid light-dark(#ccc, #555); border-radius: 6px; margin: 0 0 1rem; }
  legend { font-weight: 600; padding: 0 .3rem; }
  label { margin-right: 1.2rem; white-space: nowrap; }
  output { display: block; font: 15px ui-monospace, monospace; background: light-dark(#f4f4f4, #2a2a2a); padding: .6rem;
           border-radius: 6px; overflow-wrap: anywhere; }
  .row { display: flex; gap: .5rem; align-items: center; margin-bottom: .6rem; }
  .row output { flex: 1; }
</style>

<h1>NU7.1 miner poll ballot</h1>
<p>Answer the questions of the <a href="https://zfnd.org/zcap-poll-now-open-nu7-1/">ZCAP NU7.1 poll</a>
and put the ballot in your coinbase data. Poll details: <a href="https://hackmd.io/@upbqdn/nu7-1-miner-poll">post</a>.</p>

<form id="questions"></form>

<h2>Ballot</h2>
<div class="row"><output id="ballot"></output><button type="button" data-copy="ballot">Copy</button></div>
<h2>Zebra <code>[mining]</code> config</h2>
<div class="row"><output id="zebra"></output><button type="button" data-copy="zebra">Copy</button></div>

<script>
const ELECTION = "nu7-1";
const OPTIONS = ["Support", "Oppose", "Abstain"];
// Verbatim from the ZCAP poll: question, the phrase it links, the link, and the description.
const QUESTIONS = [
  ["Question 1: Do you support the Wind Down Zcash Community Grants proposal?",
   "Wind Down Zcash Community Grants proposal",
   "https://github.com/zcash/zips/pull/1423/changes#diff-c85d64fb191988fdc52f65030988452ad0865454f57a5f38b4bcd38831c5b490R60-R66",
   "This proposal would wind down Zcash Community Grants and end new grants. Grants already awarded would continue, with payments made as agreed milestones are met. After covering existing grants and wind-down costs, remaining funds would go to the Future Dev and Legal Defense Fund lockbox. If Zcash Community Grants’ 8% funding stream is still active when the upgrade takes effect, it would go to that lockbox until the November 2028 halving."],
  ["Question 2: Do you support the Future Dev and Legal Defense Fund proposal?",
   "Future Dev and Legal Defense Fund proposal",
   "https://zips.z.cash/draft-mcgee-future-dev-legal-defense-fund",
   "This proposal would redirect Zcash Community Grants’ 8% funding stream to a new Future Dev and Legal Defense Fund lockbox requiring community approval for disbursements, require Zcash Community Grants to contribute 50,000 ZEC to the NSM, and preserve Zcash Community Grants and its grant program with its remaining treasury."],
  ["Question 3: Do you support the Zcash Adoption Pool (ZAP) proposal?",
   "Zcash Adoption Pool (ZAP) proposal",
   "https://zips.z.cash/draft-dairaemma-governance-zap",
   "This proposal would retain Zcash Community Grants’ existing treasury and continue its 8% funding stream through November 2028. It would rename the grant program and its pool of funds to Zcash Adoption Pool, consistent with using those funds to increase Zcash and ZEC adoption as broadly as possible. It would also leave open the possibility of using funds from the existing treasury for development and legal defense."],
  ["Question 4: Do you support maintaining Zcash Community Grants’ existing funding and operations?",
   null, null,
   "This is the status quo option. Zcash Community Grants would continue receiving its 8% funding stream through the November 2028 halving, and its treasury and operations would remain unchanged."],
  ["Question 5: Assuming it can be done safely in a network upgrade, do you support reducing Zcash’s target block time from 25 seconds to 20 seconds?",
   null, null, null],
];

const form = document.getElementById("questions");
QUESTIONS.forEach(([text, phrase, link, description], i) => {
  const set = form.appendChild(document.createElement("fieldset"));
  const legend = set.appendChild(document.createElement("legend"));
  if (phrase) {
    const [before, after] = text.split(phrase);
    legend.append(before, Object.assign(document.createElement("a"), { href: link, textContent: phrase }), after);
  } else {
    legend.textContent = text;
  }
  if (description) set.appendChild(document.createElement("p")).textContent = description;
  // Only single-choice questions with at most 9 options, which is all this poll has.
  [["-", "No answer"], ...OPTIONS.map((option, n) => [String(n + 1), option])].forEach(([value, name]) => {
    const label = set.appendChild(document.createElement("label"));
    label.appendChild(Object.assign(document.createElement("input"),
      { type: "radio", name: `q${i}`, value, checked: value === "-" }));
    label.append(` ${name}`);
  });
});

function update() {
  const answers = QUESTIONS.map((_, i) => form.elements[`q${i}`].value);
  const none = answers.every(a => a === "-");
  const ballot = `zpoll:${ELECTION}:${answers.join("")}/`;
  document.getElementById("ballot").value = none ? "Answer at least one question." : ballot;
  document.getElementById("zebra").value = none ? "" : `extra_coinbase_data = "/MyPool/ ${ballot}"`;
  document.querySelectorAll("[data-copy]").forEach(button => button.disabled = none);
}
form.addEventListener("change", update);
update();

document.querySelectorAll("[data-copy]").forEach(button => button.addEventListener("click", async () => {
  const copied = await navigator.clipboard.writeText(document.getElementById(button.dataset.copy).value)
    .then(() => true, () => false);
  button.textContent = copied ? "Copied" : "Copy failed: select the text";
  setTimeout(() => button.textContent = "Copy", 2000);
}));
</script>
